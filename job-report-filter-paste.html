<!-- ============================================================
     版型A：分開左右對齊
       篩選：靠左（左邊界對齊「屬性」）
       匯出報表／列印報表 靠右（右邊界對齊「查詢」）

     步驟1：把原本職缺標題那一行裡的 <div class="floatR">…</div> 整段刪掉
     步驟2：本段貼在 <div class="searchmail"> 「裡面的最後面」（</div> 之前），
            也就是 <div class="floatL">…</div><br> 的後面。
            同一個容器＝左右邊界天生對齊，不需要 JS 計算。
     ============================================================ -->
<style>
/* 篩選列：左右兩端對齊，與查詢列同一容器所以邊界一致 */
.rptToolBar{clear:both;width:100%;flex:1 0 100%;min-width:0;max-width:none;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;min-height:34px;margin:8px 0 2px;padding:0;}
.rptToolBar::before{content:"";display:table;clear:both;}
.rptToolBar::after{content:"";display:table;clear:both;}
.rptToolBar .jobFilter{display:flex;align-items:center;gap:6px;}
.rptToolBar .jobFilter .jfLabel{color:#333;font-weight:bold;white-space:nowrap;}
.rptToolBar .jobFilter .jfSelect{height:30px;min-width:168px;padding:0 28px 0 10px;border:1px solid #c9ced6;border-radius:3px;background:#fff url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0h10L5 6z' fill='%23666'/%3E%3C/svg%3E") no-repeat right 10px center;font-size:13px;color:#333;line-height:28px;box-sizing:border-box;cursor:pointer;-webkit-appearance:none;-moz-appearance:none;appearance:none;}
.rptToolBar .jobFilter .jfSelect:focus{border-color:#1e6fd9;outline:none;}
.rptToolBar .jobFilter .jfTip{position:relative;display:inline-flex;}
.rptToolBar .jobFilter .jfTipIcon{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:1px solid #9aa3ae;border-radius:50%;background:#fff;color:#6b7480;font-size:11px;font-style:normal;font-family:Georgia,"Times New Roman",serif;line-height:1;cursor:pointer;user-select:none;}
.rptToolBar .jobFilter .jfTipIcon:hover,.rptToolBar .jobFilter .jfTipIcon:focus{border-color:#1e6fd9;color:#1e6fd9;outline:none;}
.rptToolBar .jobFilter .jfTipBox{position:absolute;top:calc(100% + 9px);left:50%;transform:translateX(-16px);z-index:999;display:none;min-width:200px;max-width:280px;padding:7px 10px;border:1px solid #d8dde4;border-radius:3px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);color:#d05a1e;font-size:12px;line-height:1.5;text-align:left;white-space:normal;word-break:break-all;}
.rptToolBar .jobFilter .jfTipBox::before,.rptToolBar .jobFilter .jfTipBox::after{content:"";position:absolute;left:12px;border:6px solid transparent;}
.rptToolBar .jobFilter .jfTipBox::before{top:-13px;border-bottom-color:#d8dde4;}
.rptToolBar .jobFilter .jfTipBox::after{top:-12px;border-bottom-color:#fff;}
.rptToolBar .jobFilter .jfTip:hover .jfTipBox,
.rptToolBar .jobFilter .jfTipIcon:focus + .jfTipBox,
.rptToolBar .jobFilter .jfTipBox.is-show{display:block;}
/* 右側按鈕：在 flex 容器內不用 float，仍保留原 class */
.rptToolBar .floatR{float:none;display:flex;align-items:center;}
@media screen and (max-width:640px){
  .rptToolBar{align-items:flex-start;}
  .rptToolBar .floatR{width:100%;justify-content:flex-end;}
}
/* 關鍵：讓查詢列容器高度自動撐開，篩選列放在裡面就不會溢出重疊 */
.searchmail{height:auto!important;}
.searchmail::after{content:"";display:table;clear:both;}
@media print{ .rptToolBar{display:none;} }
</style>

<div class="rptToolBar" id="rptToolBar">

  <div class="jobFilter">
    <span class="jfLabel">篩選：</span>
    <select class="jfSelect" id="selJobFilter" aria-label="職缺篩選">
      <option value="all">全部職缺</option>
      <option value="hasData" selected>僅顯示有數據職缺</option>
      <option value="mainApply">僅顯示有主投職缺</option>
    </select>
    <span class="jfTip">
      <i class="jfTipIcon" id="jobFilterTipIcon" tabindex="0" role="button"
         aria-label="篩選說明" aria-describedby="jobFilterTipBox">i</i>
      <span class="jfTipBox" id="jobFilterTipBox" role="tooltip">數據指瀏覽統計、應徵統計、曝光數統計</span>
    </span>
  </div>

  <div class="floatR">
    <input type="button" class="button0_s" id="btnExport" value="匯出報表">
    <input type="button" class="button0_s" id="btnPrint" value="列印報表">
  </div>

</div>

<script>
(function () {
  function visible(el) {
    if (!el || el.offsetParent === null) return false;
    var r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }
  function closestBy(el, cls) {
    while (el && el.nodeType === 1) {
      if ((' ' + (el.className || '') + ' ').indexOf(' ' + cls + ' ') > -1) return el;
      el = el.parentNode;
    }
    return null;
  }
  function visibleSearchmail() {
    var list = document.querySelectorAll('.searchmail');
    for (var i = 0; i < list.length; i++) { if (visible(list[i])) return list[i]; }
    return null;
  }
  /* 位置保險：確保本區塊位於「看得見的」查詢列 .searchmail 之內 */
  function place() {
    var bar = document.getElementById('rptToolBar');
    if (!bar) return;
    var sm = visibleSearchmail();
    if (!sm || bar.contains(sm)) return;
    if (sm.lastElementChild !== bar) { sm.appendChild(bar); }
  }
  /* 對齊：量測查詢列那排（.floatL）的實際左右邊界後套用，並覆蓋 flex 造成的壓縮 */
  function align() {
    var bar = document.getElementById('rptToolBar');
    if (!bar || !bar.parentNode || bar.parentNode.nodeType !== 1) return;
    var sm  = closestBy(bar, 'searchmail') || visibleSearchmail();
    if (!sm) return;
    var ref = sm.querySelector('.floatL');
    if (!ref || !visible(ref)) ref = sm;
    var rr = ref.getBoundingClientRect();
    if (!rr.width) return;
    var p  = bar.parentNode;
    var cs = window.getComputedStyle(p);
    var pr = p.getBoundingClientRect();
    var contentLeft = pr.left + (parseFloat(cs.borderLeftWidth) || 0) + (parseFloat(cs.paddingLeft) || 0);
    bar.style.flex = '0 0 auto';
    bar.style.minWidth = '0';
    bar.style.maxWidth = 'none';
    bar.style.width = rr.width + 'px';
    bar.style.marginLeft = (rr.left - contentLeft) + 'px';
    bar.style.marginRight = '0';
  }
  function run() { place(); align(); }

  run();
  if (document.readyState !== 'complete') { window.addEventListener('load', run); }
  window.addEventListener('resize', align);
  setTimeout(run, 300);
  setTimeout(run, 1200);

  var tipIcon = document.getElementById('jobFilterTipIcon');
  var tipBox  = document.getElementById('jobFilterTipBox');
  if (tipIcon && tipBox) {
    tipIcon.addEventListener('click', function (e) { e.stopPropagation(); tipBox.classList.toggle('is-show'); });
    document.addEventListener('click', function () { tipBox.classList.remove('is-show'); });
    tipIcon.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { tipBox.classList.remove('is-show'); tipIcon.blur(); }
    });
  }
  /* 切換篩選條件時，請改成呼叫網站原本的查詢／AJAX，例如 doSearch(this.value); */
  var sel = document.getElementById('selJobFilter');
  if (sel) { sel.addEventListener('change', function () { /* doSearch(this.value); */ }); }
})();
</script>
