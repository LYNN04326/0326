<style>
  .ve-wrap, .ve-wrap * { box-sizing: border-box; }
  .ve-wrap { padding: 22px 26px 26px; font-size: 14px; color: #333; }
  .ve-notice { margin: 0 0 22px; text-align: center; color: #2f78d4; }
  .ve-label { margin: 0 0 10px; }
  .ve-row { display: flex; gap: 8px; width: 100%; margin-bottom: 12px; }
  .ve-in {
    flex: 1 1 auto; min-width: 0; width: 100%; height: 38px; padding: 0 12px;
    border: 1px solid #ccc; border-radius: 3px; font-size: 14px; color: #333; outline: none;
  }
  .ve-in::placeholder { color: #b3b3b3; }
  .ve-in:focus { border-color: #2f78d4; }
  .ve-b {
    flex: 0 0 auto; height: 38px; padding: 0 18px; border-radius: 3px;
    font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .ve-b1 { border: 1px solid #2f6fd0; background: #3b7ddd; color: #fff; }
  .ve-b1:hover { background: #2f6fd0; }
  .ve-b1:disabled { background: #a9c4ea; border-color: #a9c4ea; cursor: not-allowed; }
  .ve-b2 { border: 1px solid #2f78d4; background: #fff; color: #2f78d4; }
  .ve-b2:hover { background: #f0f6ff; }
  .ve-err { min-height: 18px; margin: 0 0 4px; font-size: 13px; color: #d9534f; }
  .ve-foot { display: flex; justify-content: center; gap: 12px; padding-top: 14px; }
  .ve-foot .ve-b { min-width: 96px; }

  /* ---------- 驗證碼 3+3 格子 ---------- */
  .ve-code-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 18px 0 8px;
  }
  .ve-timer { font-size: 13px; color: #8d97a5; }
  .ve-timer b { color: #d9534f; font-weight: normal; }

  .ve-cells { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .ve-cell {
    flex: 1 1 0; min-width: 0; height: 48px; padding: 0;
    border: 1px solid #ccc; border-radius: 3px; background: #fff;
    text-align: center; font-size: 20px; color: #333; outline: none;
  }
  .ve-cell:focus { border-color: #2f78d4; border-width: 2px; }
  .ve-dash { flex: 0 0 auto; color: #9aa3ae; font-size: 18px; }

  @media (max-width: 400px) {
    .ve-wrap { padding: 20px 16px 22px; }
    .ve-b { padding: 0 12px; font-size: 13px; }
    .ve-foot .ve-b { min-width: 88px; }
    .ve-cell { height: 42px; font-size: 17px; }
    .ve-code-head { flex-wrap: wrap; gap: 4px; }
  }
</style>

<div class="ve-wrap">
  <p class="ve-notice">為保障你的帳號安全，請協助完成驗證流程。</p>
  <p class="ve-label">請輸入電子信箱取得驗證碼。</p>

  <div class="ve-row">
    <input type="email" class="ve-in" id="veMail" placeholder="example@mail.com" maxlength="60" autocomplete="email">
    <button type="button" class="ve-b ve-b1" onclick="
      var m=document.getElementById('veMail'), e=document.getElementById('veErr'), b=this;
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m.value.trim())){ e.textContent='請輸入正確的電子信箱格式（例：example@mail.com）。'; m.focus(); return; }
      e.textContent='';

      var box=document.getElementById('veTimer');
      var n=180; b.disabled=true;
      function fmt(s){ return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); }
      b.textContent='重新取得 ('+fmt(n)+')';
      box.innerHTML='驗證碼將於 <b>'+fmt(n)+'</b> 後失效';
      var t=setInterval(function(){ n--;
        if(!document.getElementById('veTimer')){ clearInterval(t); return; }
        if(n<=0){ clearInterval(t); b.disabled=false; b.textContent='重新取得驗證碼';
                  box.innerHTML='驗證碼已失效，請重新取得'; }
        else { b.textContent='重新取得 ('+fmt(n)+')';
               box.innerHTML='驗證碼將於 <b>'+fmt(n)+'</b> 後失效'; }
      },1000);

      var first=document.querySelector('.ve-cell'); if(first){ first.focus(); }
      /* TODO: 這裡呼叫後端寄送驗證碼的 API */
    ">取得驗證碼</button>
  </div>

  <div class="ve-code-head">
    <span>驗證碼</span>
    <span class="ve-timer" id="veTimer">尚未取得驗證碼</span>
  </div>

  <div class="ve-cells">
    <input class="ve-cell" maxlength="1" autocomplete="one-time-code"
      oninput="this.value=this.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase(); if(this.value){ var n=this.nextElementSibling; while(n&&!n.classList.contains('ve-cell')){ n=n.nextElementSibling; } if(n){ n.focus(); } }"
      onkeydown="if(event.key==='Backspace'&&!this.value){ var p=this.previousElementSibling; while(p&&!p.classList.contains('ve-cell')){ p=p.previousElementSibling; } if(p){ p.focus(); } }"
      onpaste="event.preventDefault(); var txt=(event.clipboardData||window.clipboardData).getData('text').replace(/[^A-Za-z0-9]/g,'').toUpperCase(); var cur=this; for(var i=0;i<txt.length&&cur;i++){ cur.value=txt.charAt(i); var n=cur.nextElementSibling; while(n&&!n.classList.contains('ve-cell')){ n=n.nextElementSibling; } cur=n; if(cur){ cur.focus(); } }">
    <input class="ve-cell" maxlength="1"
      oninput="this.value=this.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase(); if(this.value){ var n=this.nextElementSibling; while(n&&!n.classList.contains('ve-cell')){ n=n.nextElementSibling; } if(n){ n.focus(); } }"
      onkeydown="if(event.key==='Backspace'&&!this.value){ var p=this.previousElementSibling; while(p&&!p.classList.contains('ve-cell')){ p=p.previousElementSibling; } if(p){ p.focus(); } }">
    <input class="ve-cell" maxlength="1"
      oninput="this.value=this.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase(); if(this.value){ var n=this.nextElementSibling; while(n&&!n.classList.contains('ve-cell')){ n=n.nextElementSibling; } if(n){ n.focus(); } }"
      onkeydown="if(event.key==='Backspace'&&!this.value){ var p=this.previousElementSibling; while(p&&!p.classList.contains('ve-cell')){ p=p.previousElementSibling; } if(p){ p.focus(); } }">

    <span class="ve-dash">-</span>

    <input class="ve-cell" maxlength="1"
      oninput="this.value=this.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase(); if(this.value){ var n=this.nextElementSibling; while(n&&!n.classList.contains('ve-cell')){ n=n.nextElementSibling; } if(n){ n.focus(); } }"
      onkeydown="if(event.key==='Backspace'&&!this.value){ var p=this.previousElementSibling; while(p&&!p.classList.contains('ve-cell')){ p=p.previousElementSibling; } if(p){ p.focus(); } }">
    <input class="ve-cell" maxlength="1"
      oninput="this.value=this.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase(); if(this.value){ var n=this.nextElementSibling; while(n&&!n.classList.contains('ve-cell')){ n=n.nextElementSibling; } if(n){ n.focus(); } }"
      onkeydown="if(event.key==='Backspace'&&!this.value){ var p=this.previousElementSibling; while(p&&!p.classList.contains('ve-cell')){ p=p.previousElementSibling; } if(p){ p.focus(); } }">
    <input class="ve-cell" maxlength="1"
      oninput="this.value=this.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase(); if(this.value){ var n=this.nextElementSibling; while(n&&!n.classList.contains('ve-cell')){ n=n.nextElementSibling; } if(n){ n.focus(); } }"
      onkeydown="if(event.key==='Backspace'&&!this.value){ var p=this.previousElementSibling; while(p&&!p.classList.contains('ve-cell')){ p=p.previousElementSibling; } if(p){ p.focus(); } }">
  </div>

  <p class="ve-err" id="veErr"></p>

  <div class="ve-foot">
    <button type="button" class="ve-b ve-b2" onclick="layer.closeAll();">取消</button>
    <button type="button" class="ve-b ve-b1" onclick="
      var m=document.getElementById('veMail'), e=document.getElementById('veErr');
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m.value.trim())){ e.textContent='請輸入正確的電子信箱格式（例：example@mail.com）。'; m.focus(); return; }
      var cells=document.querySelectorAll('.ve-cell'), code='';
      for(var i=0;i<cells.length;i++){ code+=cells[i].value; }
      if(code.length<cells.length){ e.textContent='請完整輸入驗證碼。'; cells[code.length].focus(); return; }
      e.textContent='';
      var full=code.slice(0,3)+'-'+code.slice(3);
      /* TODO: 這裡呼叫後端驗證 API，成功後再關窗 */
      var s=document.getElementById('emailSpan'); if(s){ s.textContent=m.value.trim(); }
      layer.closeAll();
    ">確認驗證</button>
  </div>
</div>
