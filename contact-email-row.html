<!-- 電子信箱那一列：刪掉鉛筆，「[我要驗證]」改成「驗證電子信箱」按鈕 -->
<!-- 改動只有 .edit_vaule 這一段，.edit_vaule_open 原封不動 -->

<div class="profile-info-row">
    <div class="profile-info-name">
            <i id="emailIsValidIcon" class="jb-db-check-circle" aria-hidden="true"></i>
        <span class="text--14">電子信箱</span>
    </div>
    <div class="profile-info-value text--15" id="valueEmail">
        <div class="edit_vaule" style="display:flex; align-items:center;">
            <span id="emailSpan" class="edit_vaule_input"></span>
            <a id="wantEmailValid" href="javascript:void(0);" title="驗證電子信箱"
               class="modal_email_want_verification btn btn--primary btn--xs ml-8">驗證電子信箱</a>
        </div>
        <div class="edit_vaule_open">
            <input type="email" id="valueEmailInp" value="" placeholder="請輸入您的電子信箱" size="24" maxlength="60" onblur="this.value = this.value.trim()">
            <div class="btn-box">
                <a href="javascript:void(0);" title="儲存" class="btn btn--primary btn--xs edit_save">儲存</a>
                <!-- <a href="javascript:void(0);" title="儲存" class="btn btn--primary btn--xs edit_save" onclick="ToastError('更新失敗!',2000);">儲存</a> -->
                <a href="javascript:void(0);" title="取消" class="btn btn--xs edit_cancel">取消</a>
            </div>
        </div>
    </div>
</div>
