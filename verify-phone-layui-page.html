<!-- ============================================================
     放在頁面裡的兩段東西：
     A. 隱藏的彈窗內容（只有內容，不要再包 modal / 遮罩 / 標題列 / 叉叉，
        那些 layui 自己會產生）
     B. 頁面自己的 <script>（絕對不要放進 layer 的 content 裡，
        用 innerHTML 插入的 script 不會執行）
     ============================================================ -->

<!-- ===== A. 彈窗內容 ===== -->
<div id="verifyBox" style="display:none;">
  <style>
    .vp-body, .vp-body * { box-sizing: border-box; }
    .vp-body { padding: 22px 26px 8px; font-size: 14px; color: #333; }
    .vp-notice { margin: 0 0 22px; text-align: center; color: #2f78d4; }
    .vp-label { margin: 0 0 10px; }

    .vp-group { display: flex; gap: 8px; width: 100%; margin-bottom: 12px; }

    .vp-input {
      flex: 1 1 auto;
      min-width: 0;          /* 讓輸入框可收縮，按鈕右緣才對得齊 */
      width: 100%;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 14px;
      color: #333;
      outline: none;
    }

    .vp-input::placeholder { color: #b3b3b3; }
    .vp-input:focus { border-color: #2f78d4; }

    .vp-btn {
      flex: 0 0 auto;
      height: 38px;
      padding: 0 18px;
      border-radius: 3px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .vp-btn-primary { border: 1px solid #2f6fd0; background: #3b7ddd; color: #fff; }
    .vp-btn-primary:hover { background: #2f6fd0; }
    .vp-btn-primary:disabled { background: #a9c4ea; border-color: #a9c4ea; cursor: not-allowed; }

    .vp-btn-outline { border: 1px solid #2f78d4; background: #fff; color: #2f78d4; }
    .vp-btn-outline:hover { background: #f0f6ff; }

    .vp-footer { display: flex; justify-content: center; gap: 12px; padding: 20px 0 26px; }
    .vp-footer .vp-btn { min-width: 96px; }

    .vp-error { min-height: 18px; margin: 0 0 4px; font-size: 13px; color: #d9534f; }

    @media (max-width: 400px) {
      .vp-body { padding: 20px 16px 8px; }
      .vp-btn { padding: 0 12px; font-size: 13px; }
      .vp-footer .vp-btn { min-width: 88px; }
    }
  </style>

  <form class="vp-body" id="vpForm">
    <p class="vp-notice">為保障你的帳號安全，請協助完成驗證流程。</p>
    <p class="vp-label">請輸入電話號碼取得驗證碼。</p>

    <div class="vp-group">
      <input type="tel" class="vp-input" id="vpPhone" placeholder="0912345678"
             maxlength="10" autocomplete="tel">
      <button type="button" class="vp-btn vp-btn-primary" id="vpSend">取得驗證碼</button>
    </div>

    <div class="vp-group">
      <input type="text" class="vp-input" id="vpCode" placeholder="請輸入驗證碼"
             maxlength="6" inputmode="numeric" autocomplete="one-time-code">
    </div>

    <p class="vp-error" id="vpError"></p>

    <div class="vp-footer">
      <button type="button" class="vp-btn vp-btn-outline" data-vp-close>取消</button>
      <button type="button" class="vp-btn vp-btn-primary" id="vpConfirm">確認驗證</button>
    </div>
  </form>
</div>


<!-- ===== B. 頁面自己的 script ===== -->
<script>
(function () {
  // 你的頁面已經有開啟彈窗的程式碼 → 保持 false，只要把它的 content
  // 改成 document.getElementById('verifyBox').innerHTML 即可。
  // 若頁面沒有任何開窗程式碼，改成 true，由下面的 openVerify() 負責開窗。
  var BIND_OPEN = false;

  var verifyIndex = null;   // layui 這一層的 index，關閉時要用
  var timer = null;

  // 開窗：內容從 #verifyBox 取，標題和叉叉交給 layui
  function openVerify() {
    verifyIndex = layer.open({
      type: 1,
      title: '驗證手機號碼',
      area: '30rem',
      shadeClose: true,                                   // 點遮罩也能關
      content: document.getElementById('verifyBox').innerHTML,
      end: function () { stopTimer(); verifyIndex = null; } // 關掉時清乾淨
    });
  }

  // 關窗：有自己開的就用 index 關；否則關掉目前最上層那個 layer
  function closeVerify() {
    if (verifyIndex !== null) {
      layer.close(verifyIndex);
      return;
    }
    var box = document.querySelector('#vpForm');
    box = box && box.closest('.layui-layer');
    if (box && box.id) { layer.close(box.id.replace('layui-layer', '')); }
  }

  function stopTimer() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  function $id(id) { return document.getElementById(id); }

  function showError(msg) {
    var el = $id('vpError');
    if (el) { el.textContent = msg || ''; }
  }

  function validPhone(v) { return /^09\d{8}$/.test(v); }

  // 事件委派：綁在 document 上，內容什麼時候被插進來都抓得到
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) { return; }

    // 開窗（頁面上那顆「驗證電話號碼」）；頁面已有開窗程式碼時不啟用
    if (BIND_OPEN && t.closest('#wantMobileValid')) {
      e.preventDefault();
      openVerify();
      return;
    }

    // 關窗（彈窗裡的「取消」；layui 自己的叉叉不用管，它本來就會關）
    if (t.closest('[data-vp-close]')) {
      closeVerify();
      return;
    }

    // 取得驗證碼
    if (t.closest('#vpSend')) {
      var send  = $id('vpSend');
      var phone = $id('vpPhone');
      if (!validPhone(phone.value.trim())) {
        showError('請輸入正確的手機號碼格式（例：0912345678）。');
        phone.focus();
        return;
      }
      showError('');

      var left = 60;
      send.disabled = true;
      send.textContent = '重新取得 (' + left + ')';

      stopTimer();
      timer = setInterval(function () {
        left--;
        var btn = $id('vpSend');
        if (!btn) { stopTimer(); return; }      // 視窗已關就停掉
        if (left <= 0) {
          stopTimer();
          btn.disabled = false;
          btn.textContent = '取得驗證碼';
        } else {
          btn.textContent = '重新取得 (' + left + ')';
        }
      }, 1000);

      // TODO: 呼叫後端寄送簡訊的 API
      return;
    }

    // 確認驗證
    if (t.closest('#vpConfirm')) {
      var p = $id('vpPhone');
      var c = $id('vpCode');

      if (!validPhone(p.value.trim())) {
        showError('請輸入正確的手機號碼格式（例：0912345678）。');
        p.focus();
        return;
      }
      if (!c.value.trim()) {
        showError('請輸入驗證碼。');
        c.focus();
        return;
      }

      // TODO: 呼叫後端驗證 API，成功後再執行下面兩行
      var span = $id('mobileSpan');
      if (span) { span.textContent = p.value.trim(); }
      closeVerify();
    }
  });
})();
</script>
