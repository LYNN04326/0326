<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>驗證手機號碼</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Microsoft JhengHei", "PingFang TC", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    color: #333;
    background: #f2f3f5;
  }

  /* 遮罩 */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  /* 對話框 */
  .modal {
    width: 100%;
    max-width: 460px;
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .2);
    overflow: hidden;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid #e5e5e5;
    background: #f7f7f7;
  }

  .modal-title {
    margin: 0;
    font-size: 15px;
    font-weight: 500;
    color: #333;
  }

  .modal-close {
    border: 0;
    background: none;
    font-size: 20px;
    line-height: 1;
    color: #999;
    cursor: pointer;
    padding: 0 4px;
  }

  .modal-close:hover { color: #555; }

  .modal-body { padding: 22px 26px 8px; }

  .notice {
    margin: 0 0 22px;
    text-align: center;
    color: #2f78d4;
  }

  .field-label { margin: 0 0 10px; }

  /* 每一列都是滿版，兩列的左右邊界因此完全對齊 */
  .input-group {
    display: flex;
    gap: 8px;
    width: 100%;
    margin-bottom: 12px;
  }

  .form-control {
    flex: 1 1 auto;
    min-width: 0;          /* 關鍵：允許輸入框縮小，整列才不會撐爆把按鈕擠出去 */
    width: 100%;
    height: 38px;
    padding: 0 12px;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 14px;
    color: #333;
    outline: none;
  }

  .form-control::placeholder { color: #b3b3b3; }

  .form-control:focus { border-color: #2f78d4; }

  .btn {
    flex: 0 0 auto;        /* 按鈕維持自身寬度，不被拉伸也不被壓扁 */
    height: 38px;
    padding: 0 18px;
    border-radius: 3px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-primary {
    border: 1px solid #2f6fd0;
    background: #3b7ddd;
    color: #fff;
  }

  .btn-primary:hover { background: #2f6fd0; }

  .btn-primary:disabled {
    background: #a9c4ea;
    border-color: #a9c4ea;
    cursor: not-allowed;
  }

  .btn-outline {
    border: 1px solid #2f78d4;
    background: #fff;
    color: #2f78d4;
  }

  .btn-outline:hover { background: #f0f6ff; }

  .modal-footer {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 20px 26px 26px;
  }

  .modal-footer .btn { min-width: 96px; }

  .error-msg {
    min-height: 18px;
    margin: 0 0 4px;
    font-size: 13px;
    color: #d9534f;
  }

  /* 手機版：縮左右內距與按鈕內距，窄螢幕也塞得下同一列 */
  @media (max-width: 400px) {
    .modal-body { padding: 20px 16px 8px; }
    .modal-footer { padding: 20px 16px 26px; }
    .btn { padding: 0 12px; font-size: 13px; }
    .modal-footer .btn { min-width: 88px; }
  }
</style>
</head>
<body>

<div class="modal-mask" id="mask">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">驗證手機號碼</h2>
      <button type="button" class="modal-close" id="btnClose" aria-label="關閉">&times;</button>
    </div>

    <form class="modal-body" id="verifyForm">
      <p class="notice">為保障你的帳號安全，請協助完成驗證流程。</p>

      <p class="field-label">請輸入電話號碼取得驗證碼。</p>

      <div class="input-group">
        <input type="tel" class="form-control" id="phone" placeholder="0912345678"
               maxlength="10" autocomplete="tel">
        <button type="button" class="btn btn-primary" id="btnSendCode">取得驗證碼</button>
      </div>

      <div class="input-group">
        <input type="text" class="form-control" id="code" placeholder="請輸入驗證碼"
               maxlength="6" inputmode="numeric" autocomplete="one-time-code">
      </div>

      <p class="error-msg" id="errorMsg"></p>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="btnCancel">取消</button>
        <button type="submit" class="btn btn-primary" id="btnConfirm">確認驗證</button>
      </div>
    </form>
  </div>
</div>

<script>
  var mask     = document.getElementById('mask');
  var form     = document.getElementById('verifyForm');
  var phone    = document.getElementById('phone');
  var code     = document.getElementById('code');
  var errorMsg = document.getElementById('errorMsg');
  var btnSend  = document.getElementById('btnSendCode');

  function showError(msg) { errorMsg.textContent = msg || ''; }

  function closeModal() { mask.style.display = 'none'; }

  document.getElementById('btnClose').onclick  = closeModal;
  document.getElementById('btnCancel').onclick = closeModal;

  // 取得驗證碼：檢查號碼格式後開始 60 秒倒數
  btnSend.onclick = function () {
    if (!/^09\d{8}$/.test(phone.value.trim())) {
      showError('請輸入正確的手機號碼格式（例：0912345678）。');
      phone.focus();
      return;
    }
    showError('');

    var left = 60;
    btnSend.disabled = true;
    btnSend.textContent = '重新取得 (' + left + ')';

    var timer = setInterval(function () {
      left--;
      if (left <= 0) {
        clearInterval(timer);
        btnSend.disabled = false;
        btnSend.textContent = '取得驗證碼';
      } else {
        btnSend.textContent = '重新取得 (' + left + ')';
      }
    }, 1000);
  };

  // 確認驗證
  form.onsubmit = function (e) {
    e.preventDefault();

    if (!/^09\d{8}$/.test(phone.value.trim())) {
      showError('請輸入正確的手機號碼格式（例：0912345678）。');
      phone.focus();
      return;
    }
    if (!code.value.trim()) {
      showError('請輸入驗證碼。');
      code.focus();
      return;
    }

    showError('');
    alert('驗證送出：' + phone.value.trim() + ' / ' + code.value.trim());
  };
</script>

</body>
</html>
