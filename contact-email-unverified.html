<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電子信箱列 — 尚未驗證狀態</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; padding:20px; background:#fff; color:#333;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;
    font-size:13px;
  }
  .stack{display:flex; flex-direction:column; gap:14px; align-items:flex-start;}
  .cap{font-size:11px; color:#999; margin-bottom:4px;}

  /* ── 依截圖配色的欄位列 ──────────────────────── */
  .profile-info-row{
    display:inline-flex; align-items:center;
    background:#f2f4f7; border-radius:4px;
    padding:5px 10px; gap:14px;
    white-space:nowrap;
  }
  .profile-info-name{display:inline-flex; align-items:center; gap:6px; flex:none;}
  .profile-info-name .icon{flex:none; display:block;}
  .text--14{font-size:13px; color:#3b3b3b;}

  .profile-info-value{display:inline-flex; align-items:center;}
  .edit_vaule{
    display:flex; align-items:center; gap:7px;
    flex-wrap:nowrap;              /* ★ 固定同一行 */
  }
  .edit_vaule_input{
    font-size:13px; color:#333;
    white-space:nowrap;            /* ★ 信箱不斷行 */
  }
  .edit_vaule_input-ctrl{
    flex:none; width:14px; height:14px;
    color:#86b0dd; cursor:pointer;
  }
  .edit_vaule_input-ctrl:hover{color:#3f7fbf;}

  .link-h-underline{
    color:#3f7fbf; text-decoration:none; font-size:13px;
    white-space:nowrap; flex:none;  /* ★ 連結不斷行、不被壓縮 */
  }
  .link-h-underline:hover{text-decoration:underline;}
  .ml-8{margin-left:1px;}

  .text--danger{color:#e02b2b;}
</style>
</head>
<body>

<div class="stack">

  <div>
    <div class="cap">修改前</div>
    <div class="profile-info-row">
      <div class="profile-info-name">
        <svg class="icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
          <circle cx="8" cy="8" r="8" fill="#3fa64b"/>
          <path d="M4.5 8.2l2.3 2.3 4.7-4.7" fill="none" stroke="#fff"
                stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="text--14">電子信箱</span>
      </div>
      <div class="profile-info-value">
        <div class="edit_vaule">
          <span class="edit_vaule_input">lydia7775263@gmail.com</span>
          <svg class="edit_vaule_input-ctrl" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M11.2 2.2l2.6 2.6-8.2 8.2-3.3.7.7-3.3 8.2-8.2z" fill="none"
                  stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
          </svg>
          <a href="javascript:void(0);" title="我要驗證"
             class="modal_email_want_verification link-h-underline ml-8">[我要驗證]</a>
        </div>
      </div>
    </div>
  </div>

  <div>
    <div class="cap">修改後</div>
    <div class="profile-info-row">
      <div class="profile-info-name">
        <svg class="icon" viewBox="0 0 16 16" width="15" height="15" role="img" aria-label="尚未驗證">
          <circle cx="8" cy="8" r="8" fill="#e02b2b"/>
          <rect x="7.15" y="3.5" width="1.7" height="5.4" rx=".85" fill="#fff"/>
          <circle cx="8" cy="11.5" r="1" fill="#fff"/>
        </svg>
        <span class="text--14">電子信箱</span>
      </div>
      <div class="profile-info-value" id="valueEmail">
        <div class="edit_vaule">
          <span id="emailSpan" class="edit_vaule_input">lydia7775263@gmail.com</span>
          <svg class="edit_vaule_input-ctrl" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M11.2 2.2l2.6 2.6-8.2 8.2-3.3.7.7-3.3 8.2-8.2z" fill="none"
                  stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
          </svg>
          <a id="wantEmailValid" href="javascript:void(0);" title="尚未驗證"
             class="modal_email_want_verification link-h-underline ml-8">[<span class="text--danger">！</span>尚未驗證]</a>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ══════════════════════════════════════════════════════════════
     要貼回專案的只有三件事：

     一、連結那一行（id、class、方括號、連結樣式全部照舊）
     舊：<a id="wantEmailValid" href="javascript:void(0);" title="我要驗證"
            class="modal_email_want_verification link-h-underline ml-8">[我要驗證]</a>
     新：<a id="wantEmailValid" href="javascript:void(0);" title="尚未驗證"
            class="modal_email_want_verification link-h-underline ml-8">[<span class="text--danger">！</span>尚未驗證]</a>

     沒有 .text--danger 就寫死：[<span style="color:#e02b2b;">！</span>尚未驗證]

     二、欄位左邊的圖示
     舊：<i id="emailIsValidIcon" class="jb-db-check-circle" aria-hidden="true"></i>
     新：<i id="emailIsValidIcon" class="jb-db-warning-circle text--danger" aria-hidden="true"></i>

     三、避免文字變長後被擠到第二行
     #valueEmail .edit_vaule{display:flex; align-items:center; flex-wrap:nowrap;}
     #valueEmail .edit_vaule_input{white-space:nowrap;}
     #valueEmail .modal_email_want_verification{white-space:nowrap; flex:none;}

     本頁其餘 CSS 只是為了讓預覽圖接近實際頁面，不需要貼進專案。
     ══════════════════════════════════════════════════════════════ -->

</body>
</html>
